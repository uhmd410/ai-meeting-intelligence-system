<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AI Meeting Intelligence System — Dashboard overview of meetings, status summaries, and quick actions."
    />
    <title>Dashboard — AI Meeting Intelligence</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>
  <body>
    <!-- ─── Navbar ────────────────────────────────────────────── -->
    <nav class="navbar navbar-expand-lg navbar-custom">
      <div class="container">
        <a class="navbar-brand" href="/">
          <span class="brand-icon"><i class="bi bi-mic-fill"></i></span>
          MeetingAI
        </a>
        <button
          class="navbar-toggler border-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
          aria-controls="mainNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto gap-1">
            <li class="nav-item">
              <a class="nav-link active" href="/"
                ><i class="bi bi-grid-1x2-fill me-1"></i>Dashboard</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/new-meeting"
                ><i class="bi bi-plus-circle me-1"></i>New Meeting</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/history"
                ><i class="bi bi-clock-history me-1"></i>History</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- ─── Main Content ──────────────────────────────────────── -->
    <main class="main-content">
      <div class="container">
        <!-- Alert container -->
        <div id="alertContainer"></div>

        <!-- Page Header -->
        <div class="page-header">
          <div>
            <h1>Dashboard</h1>
            <p class="subtitle">
              Overview of your meetings and AI-generated minutes
            </p>
          </div>
          <a href="/new-meeting" class="btn btn-accent">
            <i class="bi bi-plus-lg me-1"></i>New Meeting
          </a>
        </div>

        <!-- Stat Cards -->
        <div class="row g-3 mb-4" id="statsRow">
          <div class="col-6 col-md-3 col-lg">
            <div class="stat-card stat-total">
              <div class="stat-icon">
                <i class="bi bi-collection"></i>
              </div>
              <div class="stat-value" id="statTotal">—</div>
              <div class="stat-label">Total Meetings</div>
            </div>
          </div>
          <div class="col-6 col-md-3 col-lg">
            <div class="stat-card stat-completed">
              <div class="stat-icon">
                <i class="bi bi-check-circle-fill"></i>
              </div>
              <div class="stat-value" id="statCompleted">—</div>
              <div class="stat-label">Completed</div>
            </div>
          </div>
          <div class="col-6 col-md-3 col-lg">
            <div class="stat-card stat-pending">
              <div class="stat-icon">
                <i class="bi bi-hourglass-split"></i>
              </div>
              <div class="stat-value" id="statPending">—</div>
              <div class="stat-label">Pending</div>
            </div>
          </div>
          <div class="col-6 col-md-3 col-lg">
            <div class="stat-card stat-failed">
              <div class="stat-icon">
                <i class="bi bi-exclamation-triangle-fill"></i>
              </div>
              <div class="stat-value" id="statFailed">—</div>
              <div class="stat-label">Failed</div>
            </div>
          </div>
          <div class="col-12 col-md-6 col-lg">
            <div class="stat-card stat-week">
              <div class="stat-icon">
                <i class="bi bi-calendar-week"></i>
              </div>
              <div class="stat-value" id="statWeek">—</div>
              <div class="stat-label">This Week</div>
            </div>
          </div>
        </div>

        <!-- Recent Meetings Table -->
        <div class="card">
          <div class="card-header d-flex align-items-center justify-content-between">
            <span><i class="bi bi-clock-history me-2"></i>Recent Meetings</span>
            <a
              href="/history"
              class="btn btn-sm btn-outline-accent"
              >View All</a
            >
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-custom mb-0">
                <thead>
                  <tr>
                    <th>Title</th>
                    <th>Status</th>
                    <th>Created</th>
                    <th class="text-end">Action</th>
                  </tr>
                </thead>
                <tbody id="recentTableBody">
                  <tr>
                    <td colspan="4" class="text-center py-4 text-muted">
                      Loading…
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/api.js"></script>
    <script>
      (async function () {
        const alertContainer = document.getElementById("alertContainer");
        const tbody = document.getElementById("recentTableBody");

        try {
          // Fetch ALL meetings (with a generous limit) to compute stats client-side
          const meetings = await listMeetings(0, 1000);

          // ── Compute stats ───────────────────────────────────
          const total = meetings.length;
          const completed = meetings.filter(
            (m) => m.status === "completed"
          ).length;
          const pending = meetings.filter(
            (m) => m.status === "pending"
          ).length;
          const failed = meetings.filter(
            (m) => m.status === "failed"
          ).length;

          // This week: meetings created since last Monday 00:00
          const now = new Date();
          const dayOfWeek = now.getDay(); // 0=Sun
          const diffToMonday = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
          const monday = new Date(now);
          monday.setDate(now.getDate() - diffToMonday);
          monday.setHours(0, 0, 0, 0);
          const thisWeek = meetings.filter(
            (m) => new Date(m.created_at) >= monday
          ).length;

          document.getElementById("statTotal").textContent = total;
          document.getElementById("statCompleted").textContent = completed;
          document.getElementById("statPending").textContent = pending;
          document.getElementById("statFailed").textContent = failed;
          document.getElementById("statWeek").textContent = thisWeek;

          // ── Render recent 5 ──────────────────────────────────
          const recent = meetings.slice(0, 5);

          if (recent.length === 0) {
            tbody.innerHTML = `
              <tr>
                <td colspan="4">
                  <div class="empty-state">
                    <i class="bi bi-inbox"></i>
                    <p>No meetings yet. Create your first meeting to get started!</p>
                  </div>
                </td>
              </tr>`;
            return;
          }

          tbody.innerHTML = recent
            .map(
              (m) => `
            <tr>
              <td>
                <a href="/meetings/${m.id}" class="table-link">${escapeHtml(m.title)}</a>
              </td>
              <td><span class="${statusBadgeClass(m.status)}">${m.status}</span></td>
              <td class="text-muted">${formatDate(m.created_at)}</td>
              <td class="text-end">
                <a href="/meetings/${m.id}" class="btn btn-sm btn-outline-accent">
                  <i class="bi bi-eye me-1"></i>View
                </a>
              </td>
            </tr>`
            )
            .join("");
        } catch (err) {
          showAlert(alertContainer, err.message, "danger");
          document.getElementById("statTotal").textContent = "!";
          document.getElementById("statCompleted").textContent = "!";
          document.getElementById("statPending").textContent = "!";
          document.getElementById("statFailed").textContent = "!";
          document.getElementById("statWeek").textContent = "!";
          tbody.innerHTML = `
            <tr>
              <td colspan="4">
                <div class="empty-state">
                  <i class="bi bi-exclamation-triangle"></i>
                  <p>Could not load meetings. Is the backend running?</p>
                </div>
              </td>
            </tr>`;
        }
      })();
    </script>
  </body>
</html>
