<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Browse, search, and sort your complete meeting history with AI-generated intelligence."
    />
    <title>Meeting History — AI Meeting Intelligence</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>
  <body>
    <!-- ─── Navbar ────────────────────────────────────────────── -->
    <nav class="navbar navbar-expand-lg navbar-custom">
      <div class="container">
        <a class="navbar-brand" href="/">
          <span class="brand-icon"><i class="bi bi-mic-fill"></i></span>
          MeetingAI
        </a>
        <button
          class="navbar-toggler border-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
          aria-controls="mainNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto gap-1">
            <li class="nav-item">
              <a class="nav-link" href="/"
                ><i class="bi bi-grid-1x2-fill me-1"></i>Dashboard</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/new-meeting"
                ><i class="bi bi-plus-circle me-1"></i>New Meeting</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="/history"
                ><i class="bi bi-clock-history me-1"></i>History</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- ─── Main Content ──────────────────────────────────────── -->
    <main class="main-content">
      <div class="container">
        <!-- Alert container -->
        <div id="alertContainer"></div>

        <!-- Page Header -->
        <div class="page-header">
          <div>
            <h1>Meeting History</h1>
            <p class="subtitle">
              Browse, search, and sort all your past meetings.
            </p>
          </div>
          <a href="/new-meeting" class="btn btn-accent">
            <i class="bi bi-plus-lg me-1"></i>New Meeting
          </a>
        </div>

        <!-- Toolbar: Search + Sort -->
        <div class="card mb-3">
          <div class="card-body py-3">
            <div class="row g-3 align-items-center">
              <div class="col-md-6">
                <div class="search-box">
                  <i class="bi bi-search search-icon"></i>
                  <input
                    type="text"
                    class="form-control"
                    id="searchInput"
                    placeholder="Search by title…"
                  />
                </div>
              </div>
              <div class="col-md-6 d-flex justify-content-md-end gap-2">
                <div class="btn-group" role="group" aria-label="Sort options">
                  <button
                    type="button"
                    class="btn btn-outline-secondary btn-sm active"
                    id="sortDateBtn"
                  >
                    <i class="bi bi-calendar-event me-1"></i>Date
                    <i class="bi bi-arrow-down" id="sortDateIcon"></i>
                  </button>
                  <button
                    type="button"
                    class="btn btn-outline-secondary btn-sm"
                    id="sortStatusBtn"
                  >
                    <i class="bi bi-tag me-1"></i>Status
                    <i class="bi bi-arrow-down" id="sortStatusIcon"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Table -->
        <div class="card">
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-custom mb-0">
                <thead>
                  <tr>
                    <th>#</th>
                    <th>Title</th>
                    <th>Status</th>
                    <th>Created</th>
                    <th class="text-end">Action</th>
                  </tr>
                </thead>
                <tbody id="historyTableBody">
                  <tr>
                    <td colspan="5" class="text-center py-4 text-muted">
                      Loading…
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- Pagination -->
        <div
          class="d-flex justify-content-between align-items-center mt-3"
          id="paginationWrapper"
          style="display: none !important"
        >
          <span class="text-muted small" id="paginationInfo"></span>
          <nav aria-label="Meeting pagination">
            <ul class="pagination mb-0" id="paginationControls">
              <li class="page-item" id="prevPageItem">
                <button class="page-link" id="prevPageBtn">
                  <i class="bi bi-chevron-left me-1"></i>Previous
                </button>
              </li>
              <li class="page-item" id="nextPageItem">
                <button class="page-link" id="nextPageBtn">
                  Next<i class="bi bi-chevron-right ms-1"></i>
                </button>
              </li>
            </ul>
          </nav>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/api.js"></script>
    <script>
      const PAGE_SIZE = 20;
      let currentSkip = 0;
      let currentData = []; // raw array from API for this page
      let sortField = "date"; // "date" | "status"
      let sortAsc = false; // default newest first
      let searchQuery = "";

      const tbody = document.getElementById("historyTableBody");
      const alertContainer = document.getElementById("alertContainer");
      const searchInput = document.getElementById("searchInput");
      const paginationWrapper = document.getElementById("paginationWrapper");
      const paginationInfo = document.getElementById("paginationInfo");
      const prevPageItem = document.getElementById("prevPageItem");
      const nextPageItem = document.getElementById("nextPageItem");
      const prevPageBtn = document.getElementById("prevPageBtn");
      const nextPageBtn = document.getElementById("nextPageBtn");
      const sortDateBtn = document.getElementById("sortDateBtn");
      const sortStatusBtn = document.getElementById("sortStatusBtn");
      const sortDateIcon = document.getElementById("sortDateIcon");
      const sortStatusIcon = document.getElementById("sortStatusIcon");

      // ── Fetch page ───────────────────────────────────────────
      async function fetchPage() {
        try {
          currentData = await listMeetings(currentSkip, PAGE_SIZE);
          renderTable();
          updatePagination();
        } catch (err) {
          showAlert(alertContainer, err.message, "danger");
          tbody.innerHTML = `
            <tr>
              <td colspan="5">
                <div class="empty-state">
                  <i class="bi bi-exclamation-triangle"></i>
                  <p>Could not load meetings.</p>
                </div>
              </td>
            </tr>`;
        }
      }

      // ── Render table with search + sort applied ──────────────
      function renderTable() {
        let data = [...currentData];

        // Client-side search filter
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          data = data.filter((m) => m.title.toLowerCase().includes(q));
        }

        // Client-side sort
        data.sort((a, b) => {
          let cmp = 0;
          if (sortField === "date") {
            cmp =
              new Date(a.created_at).getTime() -
              new Date(b.created_at).getTime();
          } else {
            // status: alphabetical
            cmp = a.status.localeCompare(b.status);
          }
          return sortAsc ? cmp : -cmp;
        });

        if (data.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="5">
                <div class="empty-state">
                  <i class="bi bi-inbox"></i>
                  <p>${searchQuery ? "No meetings match your search." : "No meetings found."}</p>
                </div>
              </td>
            </tr>`;
          return;
        }

        tbody.innerHTML = data
          .map(
            (m, i) => `
          <tr>
            <td class="text-muted">${currentSkip + i + 1}</td>
            <td>
              <a href="/meetings/${m.id}" class="table-link">${escapeHtml(m.title)}</a>
            </td>
            <td><span class="${statusBadgeClass(m.status)}">${m.status}</span></td>
            <td class="text-muted">${formatDate(m.created_at)}</td>
            <td class="text-end">
              <a href="/meetings/${m.id}" class="btn btn-sm btn-outline-accent">
                <i class="bi bi-eye me-1"></i>View
              </a>
            </td>
          </tr>`
          )
          .join("");
      }

      // ── Pagination controls ──────────────────────────────────
      function updatePagination() {
        const hasData = currentData.length > 0;
        paginationWrapper.style.display = hasData ? "flex" : "none";
        paginationWrapper.style.setProperty("display", hasData ? "flex" : "none", "important");

        const pageNum = Math.floor(currentSkip / PAGE_SIZE) + 1;
        const showing = currentData.length;
        paginationInfo.textContent = `Showing ${currentSkip + 1}–${currentSkip + showing} meetings (page ${pageNum})`;

        // Previous
        if (currentSkip <= 0) {
          prevPageItem.classList.add("disabled");
          prevPageBtn.setAttribute("disabled", "");
        } else {
          prevPageItem.classList.remove("disabled");
          prevPageBtn.removeAttribute("disabled");
        }

        // Next: if we got a full page, there might be more
        if (currentData.length < PAGE_SIZE) {
          nextPageItem.classList.add("disabled");
          nextPageBtn.setAttribute("disabled", "");
        } else {
          nextPageItem.classList.remove("disabled");
          nextPageBtn.removeAttribute("disabled");
        }
      }

      prevPageBtn.addEventListener("click", () => {
        if (currentSkip > 0) {
          currentSkip -= PAGE_SIZE;
          if (currentSkip < 0) currentSkip = 0;
          fetchPage();
        }
      });

      nextPageBtn.addEventListener("click", () => {
        if (currentData.length >= PAGE_SIZE) {
          currentSkip += PAGE_SIZE;
          fetchPage();
        }
      });

      // ── Search ───────────────────────────────────────────────
      searchInput.addEventListener("input", () => {
        searchQuery = searchInput.value.trim();
        renderTable();
      });

      // ── Sort buttons ─────────────────────────────────────────
      function updateSortButtons() {
        sortDateBtn.classList.toggle("active", sortField === "date");
        sortStatusBtn.classList.toggle("active", sortField === "status");

        sortDateIcon.className =
          sortField === "date"
            ? sortAsc
              ? "bi bi-arrow-up"
              : "bi bi-arrow-down"
            : "bi bi-arrow-down";
        sortStatusIcon.className =
          sortField === "status"
            ? sortAsc
              ? "bi bi-arrow-up"
              : "bi bi-arrow-down"
            : "bi bi-arrow-down";
      }

      sortDateBtn.addEventListener("click", () => {
        if (sortField === "date") {
          sortAsc = !sortAsc;
        } else {
          sortField = "date";
          sortAsc = false;
        }
        updateSortButtons();
        renderTable();
      });

      sortStatusBtn.addEventListener("click", () => {
        if (sortField === "status") {
          sortAsc = !sortAsc;
        } else {
          sortField = "status";
          sortAsc = true;
        }
        updateSortButtons();
        renderTable();
      });

      // ── Init ─────────────────────────────────────────────────
      fetchPage();
    </script>
  </body>
</html>
