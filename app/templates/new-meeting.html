<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Create a new meeting — paste a transcript or upload a file to generate AI-powered meeting minutes."
    />
    <title>New Meeting — AI Meeting Intelligence</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/static/css/styles.css" />
    <script src="/static/js/theme.js"></script>
  </head>
  <body>
    <!-- ─── Navbar ────────────────────────────────────────────── -->
    <nav class="navbar navbar-expand-lg navbar-custom">
      <div class="container">
        <a class="navbar-brand" href="/">
          <span class="brand-icon"><i class="bi bi-mic-fill"></i></span>
          MeetingAI
        </a>
        <button
          class="navbar-toggler border-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
          aria-controls="mainNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto gap-1">
            <li class="nav-item">
              <a class="nav-link" href="/"
                ><i class="bi bi-grid-1x2-fill me-1"></i>Dashboard</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="/new-meeting"
                ><i class="bi bi-plus-circle me-1"></i>New Meeting</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/history"
                ><i class="bi bi-clock-history me-1"></i>History</a
              >
            </li>
          </ul>
          <button
            class="theme-toggle-btn ms-2"
            id="themeToggleBtn"
            type="button"
            onclick="toggleTheme()"
            aria-label="Toggle dark mode"
            title="Toggle dark mode"
          >
            <i class="bi bi-moon-fill"></i>
          </button>
        </div>
      </div>
    </nav>

    <!-- ─── Loading Overlay (hidden by default) ───────────────── -->
    <div id="loadingOverlay" class="loading-overlay" style="display: none">
      <div class="spinner-grow" role="status"></div>
      <p id="loadingMessage">Creating meeting…</p>
    </div>

    <!-- ─── Main Content ──────────────────────────────────────── -->
    <main class="main-content">
      <div class="container" style="max-width: 720px">
        <!-- Alert container -->
        <div id="alertContainer"></div>

        <!-- Page Header -->
        <div class="page-header">
          <div>
            <h1><i class="bi bi-plus-circle me-2" style="color: var(--accent)"></i>New Meeting</h1>
            <p class="subtitle">
              Paste a transcript, upload a file, or upload audio — we'll
              generate minutes automatically.
            </p>
          </div>
        </div>

        <!-- Form Card -->
        <div class="card">
          <div class="card-body p-4">
            <form id="newMeetingForm" novalidate>
              <!-- Title -->
              <div class="mb-4">
                <label for="meetingTitle" class="form-label"
                  >Meeting Title <span class="text-danger">*</span></label
                >
                <input
                  type="text"
                  class="form-control"
                  id="meetingTitle"
                  placeholder="e.g. Weekly Sprint Review — July 28"
                  required
                />
                <div class="invalid-feedback">
                  Please enter a meeting title.
                </div>
              </div>

              <!-- Transcript Input Mode Tabs -->
              <div class="mb-3">
                <label class="form-label">Transcript Source</label>
                <ul
                  class="nav nav-tabs input-mode-toggle"
                  id="inputModeTabs"
                  role="tablist"
                >
                  <li class="nav-item" role="presentation">
                    <button
                      class="nav-link active"
                      id="paste-tab"
                      data-bs-toggle="tab"
                      data-bs-target="#pastePanel"
                      type="button"
                      role="tab"
                      aria-controls="pastePanel"
                      aria-selected="true"
                    >
                      <i class="bi bi-clipboard me-1"></i>Paste Transcript
                    </button>
                  </li>
                  <li class="nav-item" role="presentation">
                    <button
                      class="nav-link"
                      id="upload-tab"
                      data-bs-toggle="tab"
                      data-bs-target="#uploadPanel"
                      type="button"
                      role="tab"
                      aria-controls="uploadPanel"
                      aria-selected="false"
                    >
                      <i class="bi bi-upload me-1"></i>Upload File
                    </button>
                  </li>
                  <li class="nav-item" role="presentation">
                    <button
                      class="nav-link"
                      id="audio-tab"
                      data-bs-toggle="tab"
                      data-bs-target="#audioPanel"
                      type="button"
                      role="tab"
                      aria-controls="audioPanel"
                      aria-selected="false"
                    >
                      <i class="bi bi-soundwave me-1"></i>Upload Audio
                    </button>
                  </li>
                </ul>

                <div class="tab-content border border-top-0 rounded-bottom p-3">
                  <!-- Paste Panel -->
                  <div
                    class="tab-pane fade show active"
                    id="pastePanel"
                    role="tabpanel"
                    aria-labelledby="paste-tab"
                  >
                    <textarea
                      class="form-control"
                      id="rawText"
                      rows="10"
                      placeholder="Paste the full meeting transcript here…"
                    ></textarea>
                  </div>

                  <!-- Upload Panel -->
                  <div
                    class="tab-pane fade"
                    id="uploadPanel"
                    role="tabpanel"
                    aria-labelledby="upload-tab"
                  >
                    <input
                      class="form-control"
                      type="file"
                      id="fileInput"
                      accept=".txt,.docx"
                    />
                    <div class="form-text mt-2">
                      Accepted formats: <strong>.txt</strong> or
                      <strong>.docx</strong> only
                    </div>
                    <div
                      id="fileError"
                      class="text-danger small mt-1"
                      style="display: none"
                    ></div>
                  </div>

                  <!-- Audio Upload Panel -->
                  <div
                    class="tab-pane fade"
                    id="audioPanel"
                    role="tabpanel"
                    aria-labelledby="audio-tab"
                  >
                    <input
                      class="form-control"
                      type="file"
                      id="audioInput"
                      accept=".mp3,.wav,.m4a,.ogg"
                    />
                    <div class="form-text mt-2">
                      Accepted formats: <strong>.mp3</strong>,
                      <strong>.wav</strong>, <strong>.m4a</strong>, or
                      <strong>.ogg</strong> (max 25 MB)
                    </div>
                    <div
                      id="audioError"
                      class="text-danger small mt-1"
                      style="display: none"
                    ></div>
                  </div>
                </div>
              </div>

              <!-- Submit -->
              <div class="d-grid mt-4">
                <button
                  type="submit"
                  class="btn btn-accent btn-lg"
                  id="submitBtn"
                >
                  <i class="bi bi-stars me-2"></i>Generate Minutes
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/api.js"></script>
    <script>
      const form = document.getElementById("newMeetingForm");
      const titleInput = document.getElementById("meetingTitle");
      const rawTextArea = document.getElementById("rawText");
      const fileInput = document.getElementById("fileInput");
      const audioInput = document.getElementById("audioInput");
      const submitBtn = document.getElementById("submitBtn");
      const alertContainer = document.getElementById("alertContainer");
      const overlay = document.getElementById("loadingOverlay");
      const loadingMsg = document.getElementById("loadingMessage");
      const fileError = document.getElementById("fileError");
      const audioError = document.getElementById("audioError");

      // Determine which tab is active
      function getActiveMode() {
        if (document.getElementById("paste-tab").classList.contains("active"))
          return "paste";
        if (document.getElementById("upload-tab").classList.contains("active"))
          return "upload";
        if (document.getElementById("audio-tab").classList.contains("active"))
          return "audio";
        return "paste";
      }

      // Client-side file extension validation
      function validateFile(file) {
        const ext = file.name.split(".").pop().toLowerCase();
        if (ext !== "txt" && ext !== "docx") {
          return "Only .txt and .docx files are accepted.";
        }
        return null;
      }

      // Client-side audio validation
      function validateAudio(file) {
        const ext = file.name.split(".").pop().toLowerCase();
        const allowed = ["mp3", "wav", "m4a", "ogg"];
        if (!allowed.includes(ext)) {
          return "Only .mp3, .wav, .m4a, and .ogg files are accepted.";
        }
        const maxSize = 25 * 1024 * 1024; // 25 MB
        if (file.size > maxSize) {
          const sizeMb = (file.size / (1024 * 1024)).toFixed(1);
          return `File is too large (${sizeMb} MB). Maximum allowed is 25 MB.`;
        }
        return null;
      }

      fileInput.addEventListener("change", () => {
        if (fileInput.files.length > 0) {
          const err = validateFile(fileInput.files[0]);
          if (err) {
            fileError.textContent = err;
            fileError.style.display = "block";
            fileInput.value = "";
          } else {
            fileError.style.display = "none";
          }
        }
      });

      audioInput.addEventListener("change", () => {
        if (audioInput.files.length > 0) {
          const err = validateAudio(audioInput.files[0]);
          if (err) {
            audioError.textContent = err;
            audioError.style.display = "block";
            audioInput.value = "";
          } else {
            audioError.style.display = "none";
          }
        }
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        // Clear previous alerts
        alertContainer.innerHTML = "";

        // Validate title
        const title = titleInput.value.trim();
        if (!title) {
          titleInput.classList.add("is-invalid");
          titleInput.focus();
          return;
        }
        titleInput.classList.remove("is-invalid");

        // Validate transcript source
        const mode = getActiveMode();
        let rawText = null;
        let file = null;

        if (mode === "paste") {
          rawText = rawTextArea.value.trim();
          if (!rawText) {
            showAlert(
              alertContainer,
              "Please paste a transcript or switch to the Upload tab.",
              "warning"
            );
            rawTextArea.focus();
            return;
          }
        } else if (mode === "upload") {
          if (fileInput.files.length === 0) {
            showAlert(
              alertContainer,
              "Please select a .txt or .docx file to upload.",
              "warning"
            );
            return;
          }
          file = fileInput.files[0];
          const fileErr = validateFile(file);
          if (fileErr) {
            showAlert(alertContainer, fileErr, "warning");
            return;
          }
        } else if (mode === "audio") {
          if (audioInput.files.length === 0) {
            showAlert(
              alertContainer,
              "Please select an audio file to upload.",
              "warning"
            );
            return;
          }
          file = audioInput.files[0];
          const audioErr = validateAudio(file);
          if (audioErr) {
            showAlert(alertContainer, audioErr, "warning");
            return;
          }
        }

        // Show full-screen loading overlay
        overlay.style.display = "flex";
        loadingMsg.textContent =
          mode === "audio"
            ? "Transcribing audio and creating meeting…"
            : "Creating meeting…";
        submitBtn.disabled = true;

        try {
          // Step 1: Create meeting
          const meeting = await createMeeting(title, { rawText, file });

          // Step 2: Generate minutes
          loadingMsg.textContent =
            mode === "audio"
              ? "Transcribing and generating minutes… this may take a moment."
              : "Generating meeting minutes… this may take a moment.";
          await generateMinutes(meeting.id);

          // Redirect to detail page
          window.location.href = `/meetings/${meeting.id}`;
        } catch (err) {
          overlay.style.display = "none";
          submitBtn.disabled = false;
          showAlert(alertContainer, err.message, "danger");
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      });

      titleInput.addEventListener("input", () => {
        if (titleInput.value.trim()) {
          titleInput.classList.remove("is-invalid");
        }
      });
    </script>
  </body>
</html>
